<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reading List</title>
<style>
	:root { color-scheme: light dark; --fg: #1d1d1f; --muted: #6e6e73; --bg: #fbfbfd; --card: #ffffff; --line: #d8d8de; --accent: #6c5ce7; }
	body[data-theme="dark"] { --fg: #e6e6ea; --muted: #9a9aa3; --bg: #1e1e22; --card: #26262b; --line: #3a3a42; --accent: #9d8cff; }
	html, body { margin: 0; }
	body { font: 15px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif; color: var(--fg); background: var(--bg);
		padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; }
	.bar { display: flex; gap: 10px; align-items: center; }
	#status { color: var(--muted); font-size: 13px; flex: 1; }
	button { font: inherit; min-height: 44px; min-width: 44px; border: 1px solid var(--line); background: var(--card);
		color: var(--fg); border-radius: 8px; padding: 0 12px; cursor: pointer; }
	ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
	li button { width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 8px 12px; }
	.title { font-weight: 600; color: var(--accent); }
	.date { color: var(--muted); font-variant-numeric: tabular-nums; grid-row: span 2; align-self: center; }
	.author { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
	<div class="bar"><span id="status" role="status">Waiting for permission…</span><button id="refresh" type="button" disabled>Refresh</button></div>
	<ul id="list" aria-label="To read"></ul>
	<script src="app.js"></script>
</body>
</html>
