<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Replicator Dynamics Lab</title>
<style>
	:root { color-scheme: light dark; --fg: #1d1d1f; --muted: #6e6e73; --bg: #fbfbfd; --card: #ffffff; --line: #d8d8de;
		--accent: #6c5ce7; --s1: #2f6fdb; --s2: #d9480f; --s3: #2b8a3e; --stable: #1a7f37; --unstable: #cf222e; }
	body[data-theme="dark"] { --fg: #e6e6ea; --muted: #9a9aa3; --bg: #1e1e22; --card: #26262b; --line: #3a3a42;
		--accent: #9d8cff; --s1: #6ea8ff; --s2: #ff8f5a; --s3: #5fd17a; --stable: #3fb950; --unstable: #ff6b61; }
	html, body { margin: 0; }
	body { font: 14px/1.4 -apple-system, "Segoe UI", system-ui, sans-serif; color: var(--fg); background: var(--bg);
		padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; }
	.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
	select, button { font: inherit; min-height: 44px; min-width: 44px; border: 1px solid var(--line); background: var(--card);
		color: var(--fg); border-radius: 8px; padding: 0 12px; cursor: pointer; }
	button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
	.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
	@media (max-width: 560px) { .cols { grid-template-columns: 1fr; } }
	.panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
	.panel h3 { margin: 0 0 4px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
	canvas { width: 100%; height: 200px; display: block; touch-action: none; }
	#matrix { display: grid; gap: 4px 8px; align-items: center; }
	#matrix .head { font-size: 12px; color: var(--muted); text-align: center; }
	#matrix .row { font-weight: 600; }
	.cell { display: flex; flex-direction: column; align-items: stretch; }
	.cell output { text-align: center; font-variant-numeric: tabular-nums; }
	input[type=range] { width: 100%; min-height: 44px; margin: 0; accent-color: var(--accent); }
	.slider { display: grid; grid-template-columns: auto 1fr 3.5em; gap: 8px; align-items: center; }
	.slider output { font-variant-numeric: tabular-nums; text-align: right; }
	#summary { margin: 0; white-space: pre-wrap; font-size: 13px; }
	#status { color: var(--muted); font-size: 13px; }
	.legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
	.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
</style>
</head>
<body>
	<div class="bar">
		<label>Game <select id="game" aria-label="Game"></select></label>
		<button id="insert" class="primary" type="button">Insert result</button>
		<span id="status" role="status">Waiting for permission…</span>
	</div>
	<div class="cols">
		<div class="panel">
			<h3>Payoffs (row against column)</h3>
			<div id="matrix"></div>
		</div>
		<div class="panel">
			<h3>Start and horizon</h3>
			<div class="slider" id="startRow"><label for="x0">Start</label><input id="x0" type="range" min="0.01" max="0.99" step="0.01" value="0.6"><output id="x0v"></output></div>
			<div class="slider"><label for="horizon">Time</label><input id="horizon" type="range" min="5" max="120" step="1" value="30"><output id="horizonv"></output></div>
			<p class="legend" id="hint"></p>
		</div>
	</div>
	<div class="cols">
		<div class="panel"><h3>Trajectory over time</h3><canvas id="time" aria-label="Shares over time"></canvas></div>
		<div class="panel"><h3 id="phaseTitle">Phase line</h3><canvas id="phase" aria-label="Phase portrait"></canvas></div>
	</div>
	<div class="panel">
		<h3>Rest points</h3>
		<p id="summary"></p>
		<p class="legend"><span><i style="background: var(--stable)"></i>stable</span><span><i style="background: var(--unstable)"></i>unstable</span><span><i style="border: 2px solid var(--muted); width: 6px; height: 6px"></i>saddle or neutral</span></p>
	</div>
	<script src="app.js"></script>
</body>
</html>
