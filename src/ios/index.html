<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
	<!-- Diverges from desktop in frame-src only: canvas web nodes are
	     sandboxed <iframe>s here (Electron's <webview> was not subject to
	     frame-src), so the app document must allow http(s) frames. The
	     iframes stay sandboxed and the navigation delegate still denies
	     popups and pins the main frame. -->
	<meta http-equiv="Content-Security-Policy"
		content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' clew-preview://vault/__clew_assets__/ clew-preview://vault/__clew_plugin_app__/; style-src 'self' 'unsafe-inline'; img-src 'self' data: clew-preview:; media-src clew-preview:; frame-src clew-preview: https: http:; connect-src 'self' clew-preview:">
	<title>Clew</title>
	<link rel="stylesheet" href="styles/main.css">
	<link rel="stylesheet" href="styles/ios.css">
</head>
<body data-theme="dark">
	<clew-app></clew-app>
	<script type="module" src="bundle.js"></script>
</body>
</html>
