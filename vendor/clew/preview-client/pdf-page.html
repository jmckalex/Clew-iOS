<!DOCTYPE html>
<!--
  Host page for the EmbedPDF viewer, loaded in an iframe by the file tab and
  by canvas PDF nodes. Served from
  __clew_assets__/clewpdf/ so it shares the clew-preview origin with the PDF
  it is about to fetch. See pdf-page.js.
-->
<html data-theme="dark">
<head>
<meta charset="utf-8">
<title>PDF</title>
<style>
	html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
	body { background: #1a1a1e; }
	html[data-theme='light'] body { background: #fafafa; }
	#viewer { position: absolute; inset: 0; }
	/* A web PDF (read-only, §4 of docs/dev/pdf-unification.md): a strip
	   above the viewer names it and offers its three actions. */
	body.is-remote #viewer { top: 36px; }
	#remote-strip {
		display: none; position: absolute; left: 0; right: 0; top: 0; height: 36px;
		align-items: center; gap: 8px; padding: 0 10px; box-sizing: border-box;
		background: #242428; color: #cfcfd6; border-bottom: 1px solid #3a3a40;
		font: 12.5px/1.3 system-ui, sans-serif;
	}
	html[data-theme='light'] #remote-strip { background: #f1f1f4; color: #333; border-bottom-color: #ddd; }
	body.is-remote #remote-strip { display: flex; }
	#remote-strip .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	#remote-strip .stale { color: #e0a060; }
	#remote-strip button, #remote-failure button {
		font: inherit; border: 1px solid #55555c; background: transparent; color: inherit;
		border-radius: 6px; padding: 3px 10px; cursor: pointer; white-space: nowrap;
	}
	#remote-strip button:hover, #remote-failure button:hover { border-color: #8b7ec8; }
	#remote-strip button[hidden] { display: none; }
	#remote-failure {
		position: absolute; inset: 36px 0 0 0; display: flex; flex-direction: column;
		align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center;
		color: #cfcfd6; font: 14px/1.5 system-ui, sans-serif;
	}
	html[data-theme='light'] #remote-failure { color: #333; }
	#remote-failure .why { max-width: 36em; opacity: 0.8; font-size: 13px; }
	#status {
		position: absolute; right: 10px; bottom: 8px; z-index: 10;
		padding: 3px 9px; border-radius: 10px;
		background: rgba(0, 0, 0, 0.6); color: #fff;
		font: 12px/1.4 system-ui, sans-serif;
		opacity: 0; transition: opacity 0.2s;
		pointer-events: none;
	}
</style>
</head>
<body>
<div id="remote-strip" role="toolbar" aria-label="Web PDF">
	<span class="what"></span>
	<button type="button" data-act="save">Save a copy to the vault</button>
	<button type="button" data-act="open">Open in browser</button>
	<button type="button" data-act="reload" title="Fetch it from the web again now">Reload</button>
</div>
<div id="viewer"></div>
<div id="status"></div>
<script src="pdf-page.js"></script>
</body>
</html>
