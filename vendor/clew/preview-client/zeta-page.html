<!DOCTYPE html>
<!--
  Host page for the ZetaOffice (LibreOffice wasm) viewer — the spike rig.
  Loaded in an iframe by the file tab (eventually; today by the smoke
  scenario), served from __clew_assets__/clewzeta/ so it shares the
  clew-preview origin with the document it is about to fetch. See
  zeta-page.js.
-->
<html>
<head>
<meta charset="utf-8">
<title>Office</title>
<style>
	html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
	body { background: #f0f0f0; }
	/* Qt requires the canvas id "qtcanvas"; no border/padding or mouse
	   coordinates go wrong (an outline would be fine). */
	#qtcanvas {
		position: absolute; inset: 0; width: 100%; height: 100%;
		border: 0 none; padding: 0; outline: none;
	}
	#status {
		position: absolute; left: 10px; bottom: 8px; z-index: 10;
		padding: 4px 10px; border-radius: 10px;
		background: rgba(0, 0, 0, 0.75); color: #fff;
		font: 12px/1.5 ui-monospace, monospace;
		white-space: pre; pointer-events: none;
	}
</style>
</head>
<body>
<div class="canvas-holder" onselectstart="event.preventDefault()">
	<canvas id="qtcanvas" contenteditable="true"
		oncontextmenu="event.preventDefault()"
		onkeydown="event.preventDefault()"></canvas>
</div>
<div id="status">ZetaOffice: booting…</div>
<script src="zeta-page.js"></script>
</body>
</html>
